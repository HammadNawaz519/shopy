<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Dark Slate Background Box #495464 -->
  <rect width="64" height="64" rx="10" fill="#495464"/>
  
  <!-- Subtle Inner Border in #BBBFCA -->
  <rect x="2" y="2" width="60" height="60" rx="8" stroke="#BBBFCA" stroke-width="0.8" fill="none" opacity="0.4"/>
  
  <!-- S Monogram in Warm Off-White #F4F4F2 -->
  <text 
    x="32" 
    y="45" 
    text-anchor="middle" 
    fill="#F4F4F2" 
    font-family="'Cormorant Garamond', 'Georgia', serif" 
    font-size="38" 
    font-weight="300"
  >S</text>
</svg>
