<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300">
  <!-- Clean Warm Off-White Outer Background #F4F4F2 -->
  <rect width="800" height="300" fill="#F4F4F2"/>
  
  <!-- Premium Dark Label Box in Deep Slate #495464 -->
  <rect x="80" y="60" width="640" height="180" rx="4" fill="#495464"/>
  
  <!-- Subtle Muted Inner Accent Border #BBBFCA -->
  <rect x="90" y="70" width="620" height="160" rx="2" stroke="#BBBFCA" stroke-width="1" fill="none" opacity="0.35"/>
  
  <!-- SHOPY Pure Editorial Serif Wordmark Centered in #F4F4F2 -->
  <text 
    x="400" 
    y="172" 
    text-anchor="middle" 
    fill="#F4F4F2" 
    font-family="'Cormorant Garamond', 'Playfair Display', 'Georgia', serif" 
    font-size="74" 
    font-weight="300" 
    letter-spacing="24"
  >SHOPY</text>
</svg>
